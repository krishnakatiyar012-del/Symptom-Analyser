<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArogyaAI</title>
    <style>
      :root {
        --primary-color: #1B263B; /* Darker Navy Blue */
        --secondary-color: #3EE0D7; /* Bright Teal */
        --accent-color: #FF8C42; /* Orange */
        --background-color: #040C1A; /* Very Dark Blue */
        --surface-color: #0D1B2A; /* Lighter Dark Blue for cards */
        --text-color: #E0E0E0; /* Off-white */
        --text-color-secondary: #8D99AE; /* Medium Gray for secondary text */
        --border-color: rgba(141, 153, 174, 0.2); /* Darker Gray for borders */
        --danger-color: #e74c3c;
        --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
          "Segoe UI Symbol";
        --success-color: #2ecc71;
        --warning-color: #f39c12;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: var(--font-family);
        background-color: var(--background-color);
        color: var(--text-color);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      button, .button {
        background-color: var(--accent-color);
        color: var(--background-color);
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-decoration: none;
      }

      button:hover {
        opacity: 0.9;
        transform: translateY(-2px);
      }

      button:disabled {
        background-color: var(--border-color);
        color: var(--text-color-secondary);
        cursor: not-allowed;
        transform: none;
      }

      button.secondary {
        background-color: var(--border-color);
        color: var(--text-color);
      }
    
      button.secondary:hover {
        background-color: var(--text-color-secondary);
        color: white;
      }
      
      .input-group {
        display: flex;
        flex-direction: column;
        width: 100%;
        text-align: left;
      }
      
      .input-group label {
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--text-color-secondary);
      }

      input[type="text"], input[type="email"], input[type="password"], input[type="tel"], input[type="number"], textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 1rem;
        font-family: var(--font-family);
        background-color: var(--primary-color);
        color: var(--text-color);
      }
      input:disabled {
        background-color: #2c3e50;
        cursor: not-allowed;
      }
      
      /* --- Auth Page --- */
      .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        padding: 1rem;
        background-color: var(--background-color);
      }
      .auth-card {
        background: var(--surface-color);
        padding: 2.5rem 2rem;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        width: 100%;
        max-width: 400px;
        text-align: center;
        border: 1px solid var(--border-color);
      }
      .auth-card h2 {
        color: var(--text-color);
        margin-bottom: 2rem;
      }
      .auth-card form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .auth-error {
        color: var(--danger-color);
        margin-top: -1rem;
      }
      .auth-toggle {
        color: var(--text-color-secondary);
      }
      .auth-toggle button {
        background: none;
        border: none;
        color: var(--secondary-color);
        font-weight: bold;
        padding: 0.25rem;
      }
      .auth-toggle button:hover {
        transform: none;
        text-decoration: underline;
      }

      /* --- Profile Setup --- */
      .profile-setup-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        padding: 1rem;
        background-color: var(--background-color);
      }
      .profile-setup-card {
        background: var(--surface-color);
        padding: 2.5rem 2rem;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 500px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        border: 1px solid var(--border-color);
      }
      .profile-setup-card h2 { color: var(--text-color); }
      .profile-setup-card p { color: var(--text-color-secondary); margin-top: -1rem; margin-bottom: 1rem;}

      /* --- App Layout --- */
      .app-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        max-width: 800px; /* Optional: constrain width on desktop */
        margin: 0 auto;
        background-color: var(--background-color);
      }
      .app-header-main {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.5rem;
        background-color: var(--background-color);
        color: white;
        flex-shrink: 0;
      }
      .logo { font-size: 1.5rem; font-weight: bold; display: flex; align-items: center; gap: 0.5rem; }
      .logo svg { color: var(--secondary-color); }
      .profile-menu { position: relative; }
      .profile-button {
        background: transparent;
        border: none;
        color: white;
        padding: 0.5rem;
      }
       .profile-button:hover {
        background: rgba(255,255,255,0.1);
        transform: none;
      }
      .dropdown-menu {
        position: absolute;
        top: 120%;
        right: 0;
        background: var(--surface-color);
        border-radius: 8px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 100;
        width: 160px;
        border: 1px solid var(--border-color);
      }
      .dropdown-menu a {
        padding: 0.75rem 1.5rem;
        color: var(--text-color);
        text-decoration: none;
        display: block;
      }
       .dropdown-menu a:hover {
        background-color: var(--primary-color);
      }
       .language-selector {
        padding: 0.75rem 1.5rem;
        border-top: 1px solid var(--border-color);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .language-selector label {
        font-size: 0.9rem;
        color: var(--text-color);
        font-weight: 500;
      }
      .language-selector select {
        width: 100%;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 0.25rem;
        font-size: 0.9rem;
        background-color: var(--primary-color);
        color: var(--text-color);
      }
      .app-main-content {
        flex-grow: 1;
        overflow-y: auto;
        background-color: var(--background-color);
      }
      .page-content {
        padding: 0 1.5rem 1.5rem 1.5rem;
      }
      .page-content.diagnose-page {
        padding: 0;
        height: 100%;
      }
      .footer-nav {
        display: flex;
        justify-content: space-around;
        background: var(--surface-color);
        padding: 0.5rem 0;
        border-top: 1px solid var(--border-color);
        flex-shrink: 0;
      }
      .footer-nav button {
        background: none;
        border: none;
        color: var(--text-color-secondary);
        font-size: 0.75rem;
        font-weight: 500;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 4px 12px;
      }
       .footer-nav button.active {
        color: var(--secondary-color);
      }
       .footer-nav button:hover {
        color: var(--text-color);
        transform: none;
      }
      
      /* -- Dashboard Page -- */
      .dashboard-page .greeting {
        padding: 0 1.5rem 1.5rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .greeting h2 {
        font-size: 2rem;
        font-weight: 600;
      }
      .greeting .user-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: var(--surface-color);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #FFC947;
      }
      .greeting .user-avatar svg {
        color: #FFC947;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: auto auto auto;
        gap: 1rem;
        padding: 0 1.5rem;
      }
      .dashboard-card {
        background-color: var(--surface-color);
        padding: 1rem;
        border-radius: 16px;
        color: var(--text-color);
        border: 1px solid var(--border-color);
      }
      
      .health-risk-card {
        grid-column: 1 / 2;
        grid-row: 1 / 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        text-align: center;
        padding: 1.5rem;
      }
      .progress-ring {
        position: relative;
        width: 150px;
        height: 150px;
        margin-bottom: 1rem;
      }
      .progress-ring-circle {
        transition: stroke-dashoffset 0.5s;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }
      .progress-ring-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .progress-ring-content .risk-label {
        font-size: 0.9rem;
        color: var(--text-color-secondary);
      }
      .progress-ring-content .percentage {
        font-size: 2.5rem;
        font-weight: bold;
        line-height: 1.1;
      }
      .progress-ring-content .level {
        font-size: 1rem;
        font-weight: 500;
        color: var(--text-color-secondary);
      }

      .ai-insight-card { grid-column: 2 / 3; grid-row: 1 / 2; }
      .health-trend-card { grid-column: 2 / 3; grid-row: 2 / 3; }
      .personalized-tips-card { grid-column: 1 / 2; grid-row: 3 / 4; }
      .community-snapshot-card { grid-column: 2 / 3; grid-row: 3 / 4; }

      .dashboard-card h3 {
        font-size: 1.1rem;
        margin-bottom: 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .dashboard-card p {
        font-size: 0.9rem;
        color: var(--text-color-secondary);
        line-height: 1.5;
      }
      
      .health-trend-chart {
        width: 100%;
        height: 60px;
        position: relative;
        margin-top: 1rem;
      }
      .health-trend-chart svg {
        width: 100%;
        height: 100%;
      }
      .health-trend-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--text-color-secondary);
        padding: 0 5px;
        margin-top: 4px;
      }

      .personalized-tips-card ul {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .personalized-tips-card li {
        display: flex;
        align-items: center;
        gap: 1rem;
        font-size: 0.9rem;
        color: var(--text-color-secondary);
      }
      .tip-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .tip-icon.sun { background-color: rgba(255, 201, 71, 0.2); color: #FFC947; }
      .tip-icon.water { background-color: rgba(62, 224, 215, 0.2); color: var(--secondary-color); }
      .tip-icon.food { background-color: rgba(46, 204, 113, 0.2); color: var(--success-color); }

      .community-snapshot-card .snapshot-item {
        margin-bottom: 0.75rem;
        font-size: 0.9rem;
        line-height: 1.4;
        color: var(--text-color-secondary);
      }
       .community-snapshot-card .snapshot-item strong {
        color: var(--text-color);
       }
      
      .recent-reports-section {
        padding: 1.5rem;
      }
      .recent-reports-section h2 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }
      .recent-reports-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
      }
      .report-card-small {
        background-color: var(--surface-color);
        padding: 1rem;
        border-radius: 12px;
        font-size: 0.9rem;
        border: 1px solid var(--border-color);
      }
      .report-card-small .title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      .report-card-small .date {
        font-size: 0.8rem;
        color: var(--text-color-secondary);
        margin-bottom: 1rem;
      }
      .report-card-small .tag {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--background-color);
        background-color: var(--text-color-secondary);
      }
      .tag.high { background-color: var(--danger-color); }
      .tag.medium { background-color: var(--warning-color); }
      .tag.low { background-color: var(--secondary-color); }

      /* -- Consult Page -- */
      .consult-page {
        text-align: center;
      }
      .consult-page h2 {
        margin-bottom: 2rem;
        color: var(--text-color);
      }
      .location-prompt {
        background-color: var(--surface-color);
        padding: 2rem;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .location-prompt svg {
        color: var(--secondary-color);
        margin-bottom: 0.5rem;
      }
      .location-prompt h3 {
        color: var(--text-color);
      }
      .location-prompt p {
        color: var(--text-color-secondary);
        max-width: 350px;
      }
      .clinics-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        text-align: left;
      }
      .clinics-list h3 {
        color: var(--text-color);
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-color);
      }
      .clinic-card {
        background-color: var(--surface-color);
        padding: 1rem 1.5rem;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .clinic-info {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .clinic-info span {
        font-size: 0.9rem;
        color: var(--text-color-secondary);
      }
      .map-button {
        background-color: var(--border-color);
        color: var(--text-color);
        padding: 0.5rem 1rem;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        transition: background-color 0.2s;
      }
      .map-button:hover {
        background-color: var(--secondary-color);
        color: var(--primary-color);
      }

      .ambulance-section {
        margin-top: 2rem;
        text-align: left;
      }
      .ambulance-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .ambulance-header h3 {
        color: var(--text-color);
        margin-bottom: 0;
      }
      .sos-button {
        background-color: var(--danger-color);
        color: white;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: background-color 0.2s, transform 0.2s;
      }
      .sos-button:hover {
        background-color: #c0392b; /* A darker red */
        transform: translateY(-2px);
      }
      .ambulance-content {
        background-color: var(--surface-color);
        padding: 2rem;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        text-align: center;
        color: var(--text-color-secondary);
      }

      .doctor-contact-section {
        margin-top: 2rem;
        text-align: left;
      }
      .doctor-contact-section h3 {
        color: var(--text-color);
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-color);
      }
      .doctor-card {
        background-color: var(--surface-color);
        padding: 1rem 1.5rem;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .doctor-info {
        font-weight: 600;
      }
      .doctor-actions {
        display: flex;
        gap: 0.75rem;
      }
      .doctor-actions button {
        background-color: transparent;
        border: 1px solid var(--secondary-color);
        color: var(--secondary-color);
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: 50%;
      }
      .doctor-actions button:hover {
        background-color: var(--secondary-color);
        color: var(--primary-color);
        transform: translateY(-2px);
      }

      /* -- Reports Page -- */
      .reports-list { display: flex; flex-direction: column; gap: 1rem; }
      .report-item {
        background-color: var(--surface-color);
        padding: 1rem 1.5rem;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
      }
      .report-item:hover { background-color: var(--primary-color); }
      .report-item-summary { font-size: 0.9rem; }
      .report-item-date { font-size: 0.8rem; color: var(--text-color-secondary); }
      .report-detail-view .back-button {
        margin-bottom: 1.5rem;
        background-color: transparent;
        color: var(--secondary-color);
        padding: 0.5rem 0;
      }
      .report-detail-view .back-button:hover { transform: none; background-color: transparent; text-decoration: underline; }
      
      /* -- Profile Page -- */
      .profile-page {
          display: flex;
          flex-direction: column;
          align-items: center;
      }
      .profile-page h2 { padding: 1.5rem 0; }
      .profile-card {
          background-color: var(--surface-color);
          padding: 2rem;
          border-radius: 12px;
          border: 1px solid var(--border-color);
          width: 100%;
          max-width: 500px;
          display: flex;
          flex-direction: column;
          gap: 1.5rem;
      }
      .profile-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 1rem; }
      .logout-button {
          margin-top: 2rem;
          background-color: transparent;
          color: var(--danger-color);
          border: 1px solid var(--danger-color);
      }
      .logout-button:hover { background-color: var(--danger-color); color: white; transform: none; }
      
      /* --- Symptom Analyzer Specific Styles (nested inside .diagnose-page) --- */
      .diagnose-page .main-content {
        height: 100%;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        overflow-y: auto;
      }
      .diagnose-page .disclaimer-screen h2 { color: var(--text-color); margin-bottom: 1rem; }
      .diagnose-page .disclaimer-screen p { line-height: 1.6; margin-bottom: 2rem; color: var(--text-color-secondary); }
      .diagnose-page .input-screen { display: flex; flex-direction: column; gap: 1.5rem; text-align: left; height: 100%; justify-content: flex-start; }
      .diagnose-page .image-uploader { border: 2px dashed var(--border-color); border-radius: 8px; padding: 1rem; text-align: center; cursor: pointer; transition: border-color 0.3s, background-color 0.3s; }
      .diagnose-page .image-uploader:hover { border-color: var(--secondary-color); background-color: var(--primary-color); }
      .diagnose-page .image-uploader span { color: var(--secondary-color); font-weight: 500; }
      .diagnose-page .image-previews { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
      .diagnose-page .preview-image { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; border: 2px solid var(--border-color); }
      .diagnose-page .chat-interface { display: flex; flex-direction: column; height: 100%; width: 100%; justify-content: space-between; position: relative; }
      .diagnose-page .chat-history { flex-grow: 1; overflow-y: auto; padding: 0 1rem; display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1rem; }
      .diagnose-page .chat-message { display: flex; max-width: 80%; padding: 0.75rem 1rem; border-radius: 12px; line-height: 1.5; text-align: left; }
      .diagnose-page .chat-message.user { background-color: var(--secondary-color); align-self: flex-end; border-bottom-right-radius: 2px; color: var(--primary-color); }
      .diagnose-page .chat-message.model { background-color: var(--surface-color); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--border-color); }
      .diagnose-page .chat-message img { max-width: 150px; border-radius: 8px; margin-top: 0.5rem; }
      .diagnose-page .chat-input-form { display: flex; gap: 0.5rem; padding: 1rem; border-top: 1px solid var(--border-color); align-items: center; background-color: var(--primary-color); }
      .diagnose-page .chat-input-form input { flex-grow: 1; background-color: var(--background-color); }
      .diagnose-page .chat-mic-button { background: transparent; border: none; padding: 0.5rem; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background-color 0.2s; }
      .diagnose-page .chat-mic-button:hover { background-color: var(--border-color); transform: none; }
      .diagnose-page .chat-mic-button:disabled { background-color: transparent; cursor: not-allowed; }
      .diagnose-page .chat-mic-button svg { width: 24px; height: 24px; fill: var(--text-color); }
      .spinner { border: 4px solid var(--border-color); border-top: 4px solid var(--secondary-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .loading-fullscreen {
        display: flex;
        justify-content: center;
