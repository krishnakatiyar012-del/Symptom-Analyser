<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SymptomAI Analyst</title>
    <style>
      :root {
        --primary-color: #005f73;
        --secondary-color: #0a9396;
        --background-color: #f0f4f8;
        --surface-color: #ffffff;
        --text-color: #333;
        --light-gray: #e9ecef;
        --gray: #adb5bd;
        --user-bubble: #e0f7fa;
        --model-bubble: #ffffff;
        --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
          "Segoe UI Symbol";
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-family);
        background-color: var(--background-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1rem;
      }

      #root {
        width: 100%;
        max-width: 800px;
        height: 90vh;
        max-height: 900px;
        background-color: var(--surface-color);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      
      .app-header {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: white;
        padding: 1.5rem;
        text-align: center;
        border-bottom: 1px solid var(--light-gray);
      }

      .app-header h1 {
        font-size: 1.75rem;
        font-weight: 600;
        margin: 0;
      }
      
      .app-header p {
        font-size: 0.9rem;
        opacity: 0.9;
        margin-top: 0.25rem;
      }

      .main-content {
        flex-grow: 1;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        overflow-y: auto;
      }
      
      .disclaimer-screen h2 {
        color: var(--primary-color);
        margin-bottom: 1rem;
      }

      .disclaimer-screen p {
        line-height: 1.6;
        margin-bottom: 2rem;
        color: #555;
      }

      button {
        background-color: var(--secondary-color);
        color: white;
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      button:hover {
        background-color: var(--primary-color);
        transform: translateY(-2px);
      }

      button:disabled {
        background-color: var(--gray);
        cursor: not-allowed;
        transform: none;
      }

      button.secondary {
        background-color: var(--light-gray);
        color: var(--text-color);
      }
    
      button.secondary:hover {
        background-color: var(--gray);
        color: white;
      }

      .input-screen {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        text-align: left;
        height: 100%;
        justify-content: flex-start;
      }

      .input-group {
        display: flex;
        flex-direction: column;
      }
      
      .input-group label {
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--primary-color);
      }

      textarea {
        width: 100%;
        height: 150px;
        padding: 0.75rem;
        border: 1px solid var(--light-gray);
        border-radius: 8px;
        font-size: 1rem;
        font-family: var(--font-family);
        resize: vertical;
      }
      
      .image-uploader {
        border: 2px dashed var(--light-gray);
        border-radius: 8px;
        padding: 1rem;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.3s, background-color 0.3s;
      }

      .image-uploader:hover {
        border-color: var(--secondary-color);
        background-color: #f8f9fa;
      }

      .image-uploader span {
        color: var(--secondary-color);
        font-weight: 500;
      }
      
      .image-previews {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }

      .preview-image {
        width: 80px;
        height: 80px;
        border-radius: 8px;
        object-fit: cover;
        border: 2px solid var(--light-gray);
      }

      .chat-interface {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        justify-content: space-between;
      }

      .chat-history {
        flex-grow: 1;
        overflow-y: auto;
        padding: 0 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .chat-message {
        display: flex;
        max-width: 80%;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        line-height: 1.5;
        text-align: left;
      }

      .chat-message.user {
        background-color: var(--user-bubble);
        align-self: flex-end;
        border-bottom-right-radius: 2px;
        color: var(--primary-color);
      }
      
      .chat-message.model {
        background-color: var(--model-bubble);
        align-self: flex-start;
        border-bottom-left-radius: 2px;
        border: 1px solid var(--light-gray);
      }
      
      .chat-message.model img {
        max-width: 100%;
        border-radius: 8px;
        margin-top: 0.5rem;
      }
      
      .chat-input-form {
        display: flex;
        gap: 0.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--light-gray);
      }
      
      .chat-input-form input {
        flex-grow: 1;
        padding: 0.8rem;
        border: 1px solid var(--light-gray);
        border-radius: 8px;
        font-size: 1rem;
      }

      .loading-indicator {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        flex-direction: column;
        gap: 1rem;
      }

      .spinner {
        border: 4px solid var(--light-gray);
        border-top: 4px solid var(--secondary-color);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .conclusion-card {
        background-color: var(--surface-color);
        padding: 1.5rem;
        border-radius: 12px;
        text-align: left;
        border: 1px solid var(--light-gray);
      }
      
      .conclusion-card h3 {
        color: var(--primary-color);
        margin-bottom: 1rem;
        border-bottom: 1px solid var(--light-gray);
        padding-bottom: 0.5rem;
      }

      .conclusion-card ul {
        list-style: none;
        margin-bottom: 1.5rem;
      }
      
      .conclusion-card li {
        margin-bottom: 1rem;
      }

      .conclusion-card .condition-name {
        font-weight: 600;
        font-size: 1.1rem;
      }

      .conclusion-card .confidence {
        font-style: italic;
        color: #555;
      }
      
      .conclusion-card .indicators {
        font-size: 0.9rem;
        margin-top: 0.25rem;
      }

      .final-disclaimer {
        font-weight: bold;
        color: #d9534f;
        margin-bottom: 1.5rem;
        text-align: center;
      }
      
      .button-group {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-top: 1rem;
      }

      .tips-prompt {
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--light-gray);
        text-align: center;
      }

      .tips-content {
        margin-top: 1.5rem;
        padding: 1rem;
        border-top: 1px solid var(--light-gray);
        background-color: #e0f7fa50;
        border-radius: 8px;
      }
      
      .tips-content h3 {
        color: var(--primary-color);
        margin-bottom: 0.5rem;
      }
      
      .tips-text {
        white-space: pre-wrap; 
        text-align: left;
        line-height: 1.6;
      }

      .report-footer {
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--light-gray);
        display: flex;
        justify-content: center;
        gap: 1rem;
      }

      .report-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 1rem;
      }
      
      .report-content {
        background: white;
        padding: 1rem 2rem 2rem 2rem;
        border-radius: 12px;
        width: 100%;
        max-width: 800px;
        height: 85vh;
        display: flex;
        flex-direction: column;
      }
      
      .report-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--light-gray);
        padding-bottom: 1rem;
        margin-bottom: 1rem;
      }
      
      .report-header h2 {
        color: var(--primary-color);
      }
      
      .report-body {
        overflow-y: auto;
        font-family: var(--font-family);
        padding-right: 1rem;
        text-align: left;
        flex-grow: 1;
        line-height: 1.6;
      }
      
      .report-body h4 {
        color: var(--primary-color);
        margin-top: 1.25rem;
        margin-bottom: 0.5rem;
        border-bottom: 1px solid var(--light-gray);
        padding-bottom: 0.25rem;
      }

      .report-body ul {
        list-style-position: inside;
        padding-left: 0;
      }

      .report-images {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .report-images img {
        max-width: 100px;
        border-radius: 8px;
      }

      .report-qa-list li {
        margin-bottom: 0.75rem;
        background: #f8f9fa;
        padding: 0.5rem;
        border-radius: 4px;
      }
      
      .close-button {
        background: transparent;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--gray);
      }
      
    </style>

</head>

</html>
