<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArogyaAI</title>
    <style>
      :root {
        --primary-color: #005f73;
        --secondary-color: #0a9396;
        --accent-color: #94d2bd;
        --background-color: #f0f4f8;
        --surface-color: #ffffff;
        --text-color: #0d1b2a;
        --light-gray: #e9ecef;
        --gray: #adb5bd;
        --user-bubble: #e0f7fa;
        --model-bubble: #ffffff;
        --danger-color: #d9534f;
        --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
          "Segoe UI Symbol";
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: var(--font-family);
        background-color: var(--background-color);
        color: var(--text-color);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      button {
        background-color: var(--secondary-color);
        color: white;
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      button:hover {
        background-color: var(--primary-color);
        transform: translateY(-2px);
      }

      button:disabled {
        background-color: var(--gray);
        cursor: not-allowed;
        transform: none;
      }

      button.secondary {
        background-color: var(--light-gray);
        color: var(--text-color);
      }
    
      button.secondary:hover {
        background-color: var(--gray);
        color: white;
      }
      
      .input-group {
        display: flex;
        flex-direction: column;
        width: 100%;
        text-align: left;
      }
      
      .input-group label {
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--primary-color);
      }

      input[type="text"], input[type="email"], input[type="password"], input[type="tel"], input[type="number"], textarea {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--light-gray);
        border-radius: 8px;
        font-size: 1rem;
        font-family: var(--font-family);
        background-color: #fff;
        color: var(--text-color);
      }
      input:disabled {
        background-color: #f8f9fa;
        cursor: not-allowed;
      }
      
      /* --- Auth Page --- */
      .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      }
      .auth-card {
        background: var(--surface-color);
        padding: 2.5rem 2rem;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .auth-card h2 {
        color: var(--primary-color);
        margin-bottom: 2rem;
      }
      .auth-card form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .auth-error {
        color: var(--danger-color);
        margin-top: -1rem;
      }
      .auth-toggle {
        color: #555;
      }
      .auth-toggle button {
        background: none;
        border: none;
        color: var(--secondary-color);
        font-weight: bold;
        padding: 0.25rem;
      }
      .auth-toggle button:hover {
        transform: none;
        text-decoration: underline;
      }

      /* --- Profile Setup --- */
      .profile-setup-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        padding: 1rem;
        background-color: var(--background-color);
      }
      .profile-setup-card {
        background: var(--surface-color);
        padding: 2.5rem 2rem;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 500px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      .profile-setup-card h2 { color: var(--primary-color); }
      .profile-setup-card p { color: #555; margin-top: -1rem; margin-bottom: 1rem;}

      /* --- App Layout --- */
      .app-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        max-width: 800px; /* Optional: constrain width on desktop */
        margin: 0 auto;
        background-color: var(--surface-color);
        box-shadow: 0 0 20px rgba(0,0,0,0.05);
      }
      .app-header-main {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.5rem;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        color: white;
        flex-shrink: 0;
      }
      .logo { font-size: 1.5rem; font-weight: bold; }
      .profile-menu { position: relative; }
      .profile-button {
        background: transparent;
        border: none;
        color: white;
        padding: 0.5rem;
      }
       .profile-button:hover {
        background: rgba(255,255,255,0.1);
        transform: none;
      }
      .dropdown-menu {
        position: absolute;
        top: 120%;
        right: 0;
        background: var(--surface-color);
        border-radius: 8px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 100;
        width: 160px;
      }
      .dropdown-menu a {
        padding: 0.75rem 1.5rem;
        color: var(--text-color);
        text-decoration: none;
        display: block;
      }
       .dropdown-menu a:hover {
        background-color: var(--background-color);
      }
       .language-selector {
        padding: 0.75rem 1.5rem;
        border-top: 1px solid var(--light-gray);
        border-bottom: 1px solid var(--light-gray);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .language-selector label {
        font-size: 0.9rem;
        color: var(--text-color);
        font-weight: 500;
      }
      .language-selector select {
        width: 100%;
        border: 1px solid var(--light-gray);
        border-radius: 4px;
        padding: 0.25rem;
        font-size: 0.9rem;
      }
      .app-main-content {
        flex-grow: 1;
        overflow-y: auto;
        background-color: var(--background-color);
      }
      .page-content {
        padding: 1.5rem;
      }
      .page-content.diagnose-page {
        padding: 0;
        height: 100%;
      }
      .footer-nav {
        display: flex;
        justify-content: space-around;
        background: var(--surface-color);
        padding: 0.5rem 0;
        border-top: 1px solid var(--light-gray);
        flex-shrink: 0;
      }
      .footer-nav button {
        background: none;
        border: none;
        color: var(--gray);
        font-size: 0.75rem;
        font-weight: 500;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 4px 12px;
      }
       .footer-nav button.active {
        color: var(--secondary-color);
      }
       .footer-nav button:hover {
        color: var(--primary-color);
        transform: none;
      }
      
      /* -- Dashboard Page -- */
      .dashboard-page { text-align: center; }
      .dashboard-page h2 { color: var(--primary-color); }
      .dashboard-page p { color: #555; margin-bottom: 2rem; }
      .dashboard-actions { display: flex; flex-direction: column; gap: 1rem; }
      .action-card {
        background-color: var(--surface-color);
        padding: 1.5rem;
        border-radius: 12px;
        border: 1px solid var(--light-gray);
        text-align: left;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .action-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      }
      .action-card h3 { color: var(--secondary-color); margin-bottom: 0.5rem;}
      
      /* -- Consult Page -- */
      .consult-page {
        text-align: center;
      }
      .consult-page h2 {
        margin-bottom: 2rem;
        color: var(--primary-color);
      }
      .location-prompt {
        background-color: var(--surface-color);
        padding: 2rem;
        border-radius: 12px;
        border: 1px solid var(--light-gray);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }
      .location-prompt svg {
        color: var(--accent-color);
        margin-bottom: 0.5rem;
      }
      .location-prompt h3 {
        color: var(--primary-color);
      }
      .location-prompt p {
        color: #555;
        max-width: 350px;
      }
      .clinics-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        text-align: left;
      }
      .clinics-list h3 {
        color: var(--primary-color);
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--light-gray);
      }
      .clinic-card {
        background-color: var(--surface-color);
        padding: 1rem 1.5rem;
        border-radius: 8px;
        border: 1px solid var(--light-gray);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .clinic-info {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .clinic-info span {
        font-size: 0.9rem;
        color: #555;
      }
      .map-button {
        background-color: var(--accent-color);
        color: var(--primary-color);
        padding: 0.5rem 1rem;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        transition: background-color 0.2s;
      }
      .map-button:hover {
        background-color: var(--secondary-color);
        color: white;
      }

      .ambulance-section {
        margin-top: 2rem;
        text-align: left;
      }
      .ambulance-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .ambulance-header h3 {
        color: var(--primary-color);
        margin-bottom: 0;
      }
      .sos-button {
        background-color: var(--danger-color);
        color: white;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: background-color 0.2s, transform 0.2s;
      }
      .sos-button:hover {
        background-color: #c9302c; /* A darker red */
        transform: translateY(-2px);
      }
      .ambulance-content {
        background-color: var(--surface-color);
        padding: 2rem;
        border-radius: 8px;
        border: 1px solid var(--light-gray);
        text-align: center;
        color: var(--gray);
      }

      .doctor-contact-section {
        margin-top: 2rem;
        text-align: left;
      }
      .doctor-contact-section h3 {
        color: var(--primary-color);
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--light-gray);
      }
      .doctor-card {
        background-color: var(--surface-color);
        padding: 1rem 1.5rem;
        border-radius: 8px;
        border: 1px solid var(--light-gray);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .doctor-info {
        font-weight: 600;
      }
      .doctor-actions {
        display: flex;
        gap: 0.75rem;
      }
      .doctor-actions button {
        background-color: transparent;
        border: 1px solid var(--secondary-color);
        color: var(--secondary-color);
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: 50%;
      }
      .doctor-actions button:hover {
        background-color: var(--secondary-color);
        color: white;
        transform: translateY(-2px);
      }

      /* -- Reports Page -- */
      .reports-list { display: flex; flex-direction: column; gap: 1rem; }
      .report-item {
        background-color: var(--surface-color);
        padding: 1rem 1.5rem;
        border-radius: 8px;
        border: 1px solid var(--light-gray);
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
      }
      .report-item:hover { background-color: #f8f9fa; }
      .report-item-summary { font-size: 0.9rem; }
      .report-item-date { font-size: 0.8rem; color: #555; }
      .report-detail-view .back-button {
        margin-bottom: 1.5rem;
        background-color: transparent;
        color: var(--secondary-color);
        padding: 0.5rem 0;
      }
      .report-detail-view .back-button:hover { transform: none; background-color: transparent; text-decoration: underline; }
      
      /* -- Profile Page -- */
      .profile-page {
          display: flex;
          flex-direction: column;
          align-items: center;
      }
      .profile-card {
          background-color: var(--surface-color);
          padding: 2rem;
          border-radius: 12px;
          border: 1px solid var(--light-gray);
          width: 100%;
          max-width: 500px;
          display: flex;
          flex-direction: column;
          gap: 1.5rem;
      }
      .profile-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 1rem; }
      .logout-button {
          margin-top: 2rem;
          background-color: transparent;
          color: var(--danger-color);
          border: 1px solid var(--danger-color);
      }
      .logout-button:hover { background-color: var(--danger-color); color: white; transform: none; }
      
      /* --- Symptom Analyzer Specific Styles (nested inside .diagnose-page) --- */
      .diagnose-page .main-content {
        height: 100%;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        overflow-y: auto;
      }
      .diagnose-page .disclaimer-screen h2 { color: var(--primary-color); margin-bottom: 1rem; }
      .diagnose-page .disclaimer-screen p { line-height: 1.6; margin-bottom: 2rem; color: #555; }
      .diagnose-page .input-screen { display: flex; flex-direction: column; gap: 1.5rem; text-align: left; height: 100%; justify-content: flex-start; }
      .diagnose-page textarea { height: 150px; resize: vertical; }
      .diagnose-page .image-uploader { border: 2px dashed var(--light-gray); border-radius: 8px; padding: 1rem; text-align: center; cursor: pointer; transition: border-color 0.3s, background-color 0.3s; }
      .diagnose-page .image-uploader:hover { border-color: var(--secondary-color); background-color: #f8f9fa; }
      .diagnose-page .image-uploader span { color: var(--secondary-color); font-weight: 500; }
      .diagnose-page .image-previews { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
      .diagnose-page .preview-image { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; border: 2px solid var(--light-gray); }
      .diagnose-page .chat-interface { display: flex; flex-direction: column; height: 100%; width: 100%; justify-content: space-between; position: relative; }
      .diagnose-page .chat-history { flex-grow: 1; overflow-y: auto; padding: 0 1rem; display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1rem; }
      .diagnose-page .chat-message { display: flex; max-width: 80%; padding: 0.75rem 1rem; border-radius: 12px; line-height: 1.5; text-align: left; }
      .diagnose-page .chat-message.user { background-color: var(--user-bubble); align-self: flex-end; border-bottom-right-radius: 2px; color: var(--primary-color); }
      .diagnose-page .chat-message.model { background-color: var(--model-bubble); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid var(--light-gray); }
      .diagnose-page .chat-message img { max-width: 150px; border-radius: 8px; margin-top: 0.5rem; }
      .diagnose-page .chat-input-form { display: flex; gap: 0.5rem; padding: 1rem; border-top: 1px solid var(--light-gray); align-items: center; background-color: var(--surface-color); }
      .diagnose-page .chat-input-form input { flex-grow: 1; background-color: var(--background-color); }
      .diagnose-page .chat-mic-button { background: transparent; border: none; padding: 0.5rem; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background-color 0.2s; }
      .diagnose-page .chat-mic-button:hover { background-color: var(--light-gray); transform: none; }
      .diagnose-page .chat-mic-button:disabled { background-color: transparent; cursor: not-allowed; }
      .diagnose-page .chat-mic-button svg { width: 24px; height: 24px; fill: var(--primary-color); }
      .spinner { border: 4px solid var(--light-gray); border-top: 4px solid var(--secondary-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .loading-fullscreen {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        width: 100%;
      }
      .conclusion-card { background-color: var(--surface-color); padding: 1.5rem; border-radius: 12px; text-align: left; border: 1px solid var(--light-gray); }
      .conclusion-card h3 { color: var(--primary-color); margin-bottom: 1rem; border-bottom: 1px solid var(--light-gray); padding-bottom: 0.5rem; }
      .conclusion-card ul { list-style: none; margin-bottom: 1.5rem; }
      .conclusion-card li { margin-bottom: 1rem; }
      .conclusion-card .condition-name { font-weight: 600; font-size: 1.1rem; }
      .conclusion-card .confidence { font-style: italic; color: #555; }
      .conclusion-card .indicators { font-size: 0.9rem; margin-top: 0.25rem; }
      .final-disclaimer { font-weight: bold; color: var(--danger-color); margin-bottom: 1.5rem; text-align: center; }
      .button-group { display: flex; gap: 1rem; justify-content: center; margin-top: 1rem; }
      .tips-prompt { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--light-gray); text-align: center; }
      .tips-content { margin-top: 1.5rem; padding: 1rem; border-top: 1px solid var(--light-gray); background-color: #e0f7fa50; border-radius: 8px; }
      .tips-text { white-space: pre-wrap; text-align: left; line-height: 1.6; }
      .report-footer { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--light-gray); display: flex; justify-content: center; gap: 1rem; }
      .report-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 1rem; }
      .report-content { background: white; padding: 1rem 2rem 2rem 2rem; border-radius: 12px; width: 100%; max-width: 800px; height: 85vh; display: flex; flex-direction: column; }
      .report-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--light-gray); padding-bottom: 1rem; margin-bottom: 1rem; }
      .report-body { overflow-y: auto; font-family: var(--font-family); padding-right: 1rem; text-align: left; flex-grow: 1; line-height: 1.6; }
      .report-images img { max-width: 100px; border-radius: 8px; margin-right: 8px; }
      .report-qa-list { padding-left: 0; list-style-type: none; }
      .close-button { background: transparent; border: none; font-size: 1.5rem; cursor: pointer; color: var(--gray); }
      .audio-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1001; }
      .audio-modal-content { background: var(--surface-color); padding: 2rem 3rem; border-radius: 12px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); color: var(--text-color); }
      .listening-indicator { display: flex; justify-content: center; align-items: center; height: 80px; margin: 1rem 0; }
      .listening-indicator div { width: 12px; height: 12px; background-color: var(--gray); border-radius: 50%; margin: 0 5px; transform: scale(0.6); opacity: 0.7; transition: all 0.3s ease-in-out; }
      .listening-indicator.active div { background-color: var(--secondary-color); animation: listening-pulse 1.4s infinite ease-in-out both; }
      .listening-indicator.active div:nth-child(1) { animation-delay: -0.32s; }
      .listening-indicator.active div:nth-child(2) { animation-delay: -0.16s; }
      @keyframes listening-pulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1.0); opacity: 1; } }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0"
  }
}
</script>
</head>

    <div id="root"></div>

  </body>
</html>
